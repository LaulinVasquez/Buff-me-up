name: Application quality
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55999
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-placeholder
      EXERCISEDB_BASE_URL: http://127.0.0.1:55999
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install local PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client libpq-dev
      - run: npm ci
      - name: Check application and isolated database
        run: npm run check
      - name: Check SQL Editor recovery and nutrition bundle compatibility
        env:
          BMU_WORKOUT_RECOVERY: '1'
          BMU_NUTRITION_BUNDLE: '1'
        run: npm run test:db
